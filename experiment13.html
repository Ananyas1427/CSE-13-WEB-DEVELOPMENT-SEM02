<!DOCTYPE html>
<html>
<head>
  <title>React Counter Application</title>

  <style>
    body{
      margin:0;
      background:#888c96;
      font-family:Arial;
      text-align:center;
      color:white;
    }

    .container{
      width:500px;
      margin:40px auto;
      padding:30px;
      background:#aeb0b4;
    }

    h1{
      margin-bottom:20px;
    }

    #count{
      font-size:40px;
      margin:20px 0;
    }

    button{
      width:260px;
      padding:12px;
      margin:40px 0;
      font-size:28px;
      background:#daa908;
      border:5px solid rgb(172, 105, 29);
      color:rgb(197, 39, 39);
      cursor:pointer;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>React Counter Application</h1>

    <div id="count">0</div>

    <button onclick="increment()">Increment</button>
    <br>

    <button onclick="decrement()">Decrement</button>
    <br>

    <button onclick="reset()">Reset</button>
  </div>

  <script>
    let count = 0;

    function updateCount(){
      document.getElementById("count").innerText = count;
    }

    function increment(){
      count++;
      updateCount();
    }

    function decrement(){
      count--;
      updateCount();
    }

    function reset(){
      count = 0;
      updateCount();
    }
  </script>

</body>
</html>
