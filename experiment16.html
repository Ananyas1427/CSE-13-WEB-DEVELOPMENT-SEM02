<!DOCTYPE html>
<html>
<head>
    <title>Beauty Products Showcase</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Glow Beauty Store</h1>

    <div class="container">

        <!-- Product 1 -->
        <div class="card pink">
            <img src="https://images.unsplash.com/photo-1522335789203-aabd1fc54bc9?w=500" alt="Lipstick">
            <h2>Matte Lipstick</h2>
            <p><b>Price:</b> ₹499</p>
            <p><b>Category:</b> Makeup</p>
        </div>

        <!-- Product 2 -->
        <div class="card peach">
            <img src="https://images.unsplash.com/photo-1596462502278-27bfdc403348?w=500" alt="Foundation">
            <h2>Liquid Foundation</h2>
            <p><b>Price:</b> ₹899</p>
            <p><b>Category:</b> Makeup</p>
        </div>

        <!-- Product 3 -->
        <div class="card lavender">
            <img src="https://images.unsplash.com/photo-1620916566398-39f1143ab7be?w=500" alt="Perfume">
            <h2>Luxury Perfume</h2>
            <p><b>Price:</b> ₹1499</p>
            <p><b>Category:</b> Fragrance</p>
        </div>

        <!-- Product 4 -->
        <div class="card mint">
            <img src="https://images.unsplash.com/photo-1556228578-8c89e6adf883?w=500" alt="Face Cream">
            <h2>Moisturizing Cream</h2>
            <p><b>Price:</b> ₹699</p>
            <p><b>Category:</b> Skincare</p>
        </div>

        <!-- Product 5 -->
        <div class="card rose">
            <img src="https://images.unsplash.com/photo-1515377905703-c4788e51af15?w=500" alt="Serum">
            <h2>Vitamin C Serum</h2>
            <p><b>Price:</b> ₹999</p>
            <p><b>Category:</b> Skincare</p>
        </div>

    </div>

</body>
</html>
