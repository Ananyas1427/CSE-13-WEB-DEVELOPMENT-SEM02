<!DOCTYPE html>
<html>
<head>
    <title>ShopEase Login</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4, #a18cd1);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 400px;
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        /* Colored Heading Block */
        .header {
            background: linear-gradient(to right, #ff4081, #7c4dff);
            color: white;
            text-align: center;
            padding: 25px;
        }

        .header h1 {
            margin: 0;
            font-size: 32px;
        }

        .header p {
            margin-top: 8px;
            font-size: 15px;
        }

        .form-section {
            padding: 30px;
            text-align: center;
        }

        .form-section h2 {
            color: #7c4dff;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
        }

        input:focus {
            border-color: #7c4dff;
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(to right, #ff4081, #7c4dff);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            opacity: 0.9;
        }

        .link {
            margin-top: 15px;
            font-size: 14px;
        }

        a {
            color: #ff4081;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="header">
            <h1>🛍 ShopEase</h1>
            <p>Your Favorite Online Shopping Store</p>
        </div>

        <div class="form-section">
            <h2>Login</h2>

            <form>
                <input type="email" placeholder="Enter Email Address" required>

                <input type="password" placeholder="Enter Password" required>

                <button type="submit">Login</button>

                <p class="link">
                    <a href="#">Forgot Password?</a>
                </p>

                <p class="link">
                    New User? <a href="#">Create Account</a>
                </p>
            </form>
        </div>

    </div>

</body>
</html>
