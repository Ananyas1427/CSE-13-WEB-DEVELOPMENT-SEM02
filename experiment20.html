<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration Form</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#d1fae5,#ccfbf1);
}

.container{
    width:750px;
    background:linear-gradient(135deg,#0f766e,#14b8a6);
    padding:35px;
    border-radius:18px;
    box-shadow:0 15px 30px rgba(0,0,0,0.25);
}

h1{
    text-align:center;
    color:white;
    margin-bottom:30px;
    font-size:38px;
    letter-spacing:1px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.input-box{
    display:flex;
    flex-direction:column;
}

label{
    color:white;
    margin-bottom:6px;
    font-size:15px;
    font-weight:500;
}

input, select{
    padding:12px;
    border:none;
    border-radius:8px;
    outline:none;
    font-size:14px;
    background:#f8fafc;
}

input:focus,
select:focus{
    box-shadow:0 0 8px rgba(255,255,255,0.7);
}

.full-width{
    grid-column:1/3;
}

.btn{
    text-align:center;
    margin-top:25px;
}

button{
    padding:12px 45px;
    border:none;
    border-radius:8px;
    background:#facc15;
    color:#333;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.05);
    background:#fde047;
}

@media(max-width:768px){
    .container{
        width:95%;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .full-width{
        grid-column:auto;
    }
}
</style>
</head>

<body>

<div class="container">
    <h1>Registration Form</h1>

    <form>
        <div class="form-grid">

            <div class="input-box">
                <label>First Name</label>
                <input type="text" placeholder="Enter First Name">
            </div>

            <div class="input-box">
                <label>Last Name</label>
                <input type="text" placeholder="Enter Last Name">
            </div>

            <div class="input-box">
                <label>Email</label>
                <input type="email" placeholder="Enter Email">
            </div>

            <div class="input-box">
                <label>Phone Number</label>
                <input type="tel" placeholder="Enter Phone Number">
            </div>

            <div class="input-box">
                <label>Password</label>
                <input type="password" placeholder="Enter Password">
            </div>

            <div class="input-box">
                <label>Gender</label>
                <select>
                    <option>Select Gender</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
            </div>

            <div class="input-box full-width">
                <label>Address</label>
                <input type="text" placeholder="Enter Address">
            </div>

        </div>

        <div class="btn">
            <button type="submit">Register</button>
        </div>
    </form>
</div>

</body>
</html>
