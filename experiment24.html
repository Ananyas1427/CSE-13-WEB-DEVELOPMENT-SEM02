<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration Form</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, sans-serif;
}

body{
    background: linear-gradient(135deg, #eef2ff, #dbeafe);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.container{
    width:500px;
    background: linear-gradient(135deg, #33ede7, #638ee9);
    padding:35px;
    border-radius:15px;
    box-shadow:0 10px 25px rgba(0,0,0,0.25);
}

h1{
    text-align:center;
    color:white;
    margin-bottom:25px;
    font-size:40px;
    text-shadow:2px 2px 5px rgba(0,0,0,0.3);
}

.input-box{
    width:100%;
    margin:15px 0;
}

.input-box input{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    background:#f8fafc;
    font-size:15px;
    outline:none;
}

.input-box input:focus{
    border:2px solid #5cd7b2;
}

.btn{
    text-align:center;
    margin-top:25px;
}

.btn button{
    background:#444374;
    color:white;
    border:none;
    padding:12px 40px;
    font-size:16px;
    border-radius:8px;
    cursor:pointer;
    transition:0.3s;
}

.btn button:hover{
    background:#f7ef56;
    transform:scale(1.05);
}
</style>

</head>
<body>

<div class="container">
    <h1>Registration Form</h1>

    <div class="input-box">
        <input type="text" placeholder="Enter Your Name">
    </div>

    <div class="input-box">
        <input type="email" placeholder="Enter Your Email">
    </div>

    <div class="input-box">
        <input type="password" placeholder="Enter Your Password">
    </div>

    <div class="btn">
        <button type="submit">Submit</button>
    </div>
</div>

</body>
</html>
