<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STYLEHUB</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#fafafa;
}

/* Header */

header{
position:sticky;
top:0;
background:white;
display:flex;
justify-content:space-between;
align-items:center;
padding:14px 24px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
z-index:1000;
}

.logo{
font-size:28px;
font-weight:700;
color:#ff3f6c;
}

.search{
width:40%;
padding:10px;
border:none;
background:#f5f5f6;
border-radius:6px;
}

.cart{
font-weight:bold;
}

/* Category Bar */

.topbar{
background:white;
display:flex;
justify-content:center;
gap:24px;
padding:12px;
box-shadow:0 2px 6px rgba(0,0,0,.05);
flex-wrap:wrap;
}

.topbar button{
border:none;
background:none;
font-weight:700;
cursor:pointer;
font-size:14px;
}

.topbar button:hover{
color:#ff3f6c;
}

/* Hero Section */

.hero{
background:linear-gradient(135deg,#ff3f6c,#ff8fab);
color:white;
text-align:center;
padding:70px 20px;
}

.hero h1{
font-size:48px;
}

.hero p{
margin-top:10px;
font-size:18px;
}

/* Offers */

.banner{
margin:20px;
padding:20px;
border-radius:12px;
background:#ffd166;
text-align:center;
}

.banner h2{
font-size:28px;
}

/* Products */

.products{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:25px;
padding:25px 40px;
}
.card{
background:white;
border-radius:12px;
overflow:hidden;
box-shadow:0 2px 10px rgba(0,0,0,.1);
transition:.3s;
}

.card:hover{
transform:translateY(-6px);
}

.card img{
width:100%;
height:320px;
object-fit:cover;
}

.card-content{
padding:12px;
}

.card h3{
font-size:16px;
min-height:45px;
}

.price{
color:#ff3f6c;
font-weight:700;
font-size:22px;
margin:8px 0;
}

.btn{
width:100%;
padding:10px;
border:none;
background:#ff3f6c;
color:white;
border-radius:6px;
cursor:pointer;
font-weight:bold;
}

.btn:hover{
opacity:.9;
}

/* Footer */

footer{
text-align:center;
padding:25px;
background:#111;
color:white;
margin-top:20px;
}

</style>
</head>

<body>

<header>

<div class="logo">
STYLEHUB
</div>

<input
type="text"
id="search"
class="search"
placeholder="Search products..."
>

<div class="cart">
🛍 Bag (<span id="cart">0</span>)
</div>

</header>

<div class="topbar">

<button onclick="filterCat('all')">
ALL
</button>

<button onclick="filterCat('fashion')">
FASHION
</button>

<button onclick="filterCat('beauty')">
BEAUTY
</button>

<button onclick="filterCat('footwear')">
FOOTWEAR
</button>

<button onclick="filterCat('home')">
HOME & LIVING
</button>

<button onclick="filterCat('accessories')">
ACCESSORIES
</button>

</div>

<section class="hero">

<h1>
STYLE FEST SALE
</h1>

<p>
Fashion • Beauty • Footwear • Home & Living
</p>

</section>

<div class="banner">

<h2>
🔥 Up To 70% OFF
</h2>

<p>
Trending Collections & New Arrivals
</p>

</div>

<div
class="products"
id="products">
</div>
<footer>
<h2>STYLEHUB</h2>
<p>Fashion • Beauty • Footwear • Home & Living • Accessories</p>
<p>© 2026 StyleHub</p>
</footer>

<script>

let bag = 0;

const products = [

{
name:"Floral Summer Dress",
category:"fashion",
price:1499,
image:"https://images.unsplash.com/photo-1496747611176-843222e1e57c?auto=format&fit=crop&w=600&q=80"
},

{
name:"Denim Jacket",
category:"fashion",
price:2499,
image:"https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=600&q=80"
},

{
name:"Men's Casual Shirt",
category:"fashion",
price:1199,
image:"https://images.unsplash.com/photo-1603252109303-2751441dd157?auto=format&fit=crop&w=600&q=80"
},

{
name:"White Sneakers",
category:"footwear",
price:2999,
image:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=600&q=80"
},

{
name:"Running Shoes",
category:"footwear",
price:3499,
image:"https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?auto=format&fit=crop&w=600&q=80"
},

{
name:"Luxury Perfume",
category:"beauty",
price:1799,
image:"https://images.unsplash.com/photo-1594035910387-fea47794261f?auto=format&fit=crop&w=600&q=80"
},

{
name:"Vitamin C Serum",
category:"beauty",
price:799,
image:"https://images.unsplash.com/photo-1556228578-8c89e6adf883?auto=format&fit=crop&w=600&q=80"
},

{
name:"Matte Lipstick",
category:"beauty",
price:599,
image:"https://images.unsplash.com/photo-1586495777744-4413f21062fa?auto=format&fit=crop&w=600&q=80"
},

{
name:"Designer Handbag",
category:"accessories",
price:2299,
image:"https://images.unsplash.com/photo-1584917865442-de89df76afd3?auto=format&fit=crop&w=600&q=80"
},

{
name:"Rose Gold Watch",
category:"accessories",
price:1999,
image:"https://images.unsplash.com/photo-1523170335258-f5ed11844a49?auto=format&fit=crop&w=600&q=80"
},

{
name:"Modern Table Lamp",
category:"home",
price:1299,
image:"https://images.unsplash.com/photo-1505693416388-ac5ce068fe85?auto=format&fit=crop&w=600&q=80"
},

{
name:"Wall Art Frame",
category:"home",
price:1499,
image:"https://images.unsplash.com/photo-1513694203232-719a280e022f?auto=format&fit=crop&w=600&q=80"
}

];

let currentProducts = [...products];

function addBag(){

bag++;

document.getElementById("cart").textContent = bag;

}

function renderProducts(list){

document.getElementById("products").innerHTML =
list.map(product => `

<div class="card">

<img
src="${product.image}"
alt="${product.name}"
>

<div class="card-content">

<h3>
${product.name}
</h3>

<div class="price">
₹${product.price.toLocaleString('en-IN')}
</div>

<button
class="btn"
onclick="addBag()"
>
ADD TO BAG
</button>

</div>

</div>

`).join("");

}

function filterCat(category){

if(category === "all"){

currentProducts = products;

renderProducts(products);

return;

}

currentProducts =
products.filter(product =>
product.category === category
);

renderProducts(currentProducts);

}

document
.getElementById("search")
.addEventListener("input", function(){

const value =
this.value.toLowerCase();

const filtered =
currentProducts.filter(product =>
product.name
.toLowerCase()
.includes(value)
);

renderProducts(filtered);

});

renderProducts(products);

</script>

</body>
</html>
